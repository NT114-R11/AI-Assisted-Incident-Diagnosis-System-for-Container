name: CI

on:
  push:
    branches:
      - main
      - master
      - observability
  pull_request:
    branches:
      - main
      - master
      - observability

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_password_2026
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_admin -d ecommerce_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: ecommerce-observability/services/${{ matrix.service }}

    env:
      DATABASE_URL: postgresql+psycopg://test_admin:test_password_2026@localhost:5432/ecommerce_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ecommerce-observability/services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Create test database tables
        run: |
          python -m tests.setup_test_db

      - name: Run tests
        run: |
          python -m pytest -v