global:
  resolve_timeout: 5m

route:
  receiver: 'email-devops'
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'email-devops'
    email_configs:
      - to: 'ops@example.com'
        send_resolved: true
        smarthost: 'smtp.example.com:587'
        from: 'alertmanager@example.com'
        auth_username: 'alertmanager'
        auth_password: 'replace-me'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
