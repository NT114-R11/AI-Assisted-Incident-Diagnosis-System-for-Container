    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 28012005
      POSTGRES_DB: ecommerce


    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  
  user-service:
    build:
      context: ./services/user-service
    
    container_name: user-service

    ports:
      - "8001:8000"
    environment:
      JWT_SECRET_KEY: 91ezxkaejRgSPr4J6twBclO3TX56upTNLHfkqrZrlFr
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      ADMIN_EMAIL: silverhd280105@gmail.com
      ADMIN_PASSWORD: quenmatkhau123
    
    depends_on:
      - postgres

  product-service:
    build:
      context: ./services/product-service

    container_name: product-service

    ports:
