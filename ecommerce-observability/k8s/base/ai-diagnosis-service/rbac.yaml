apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-diagnosis
  namespace: ecommerce

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-diagnosis-reader
  namespace: ecommerce
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/status
      - events
    verbs:
      - get
      - list

  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - replicasets
      - replicasets/status
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-diagnosis-reader
  namespace: ecommerce
subjects:
  - kind: ServiceAccount
    name: ai-diagnosis
    namespace: ecommerce
roleRef:
  kind: Role
  name: ai-diagnosis-reader
  apiGroup: rbac.authorization.k8s.io