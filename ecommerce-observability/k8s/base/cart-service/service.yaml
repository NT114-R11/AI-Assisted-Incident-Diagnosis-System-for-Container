apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: ecommerce
  annotations: 
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8003"
spec:
  selector:
    app: cart-service
  ports:
    - port: 8003
      targetPort: 8000
  type: ClusterIP