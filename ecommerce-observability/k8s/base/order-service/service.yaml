apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  annotations: 
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8004"
spec:
  selector:
    app: order-service
  ports:
    - port: 8004
      targetPort: 8000
  type: ClusterIP