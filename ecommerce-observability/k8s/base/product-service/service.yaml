apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
  annotations: 
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8002"
    
spec:
  selector:
    app: product-service
  ports:
    - port: 8002
      targetPort: 8000
  type: ClusterIP