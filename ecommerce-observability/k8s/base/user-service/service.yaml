apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce
  annotations: 
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8001"
spec:
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8000
  type: ClusterIP

